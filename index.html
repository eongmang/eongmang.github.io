<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>실시간 정보센터</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Malgun Gothic',sans-serif;
background:#f4f6f9;
color:#333;
transition:.3s;
}

body.dark{
background:#111827;
color:#fff;
}

/* 햄버거 버튼 */

.menu-btn{
position:fixed;
top:15px;
left:15px;
width:50px;
height:50px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:22px;
cursor:pointer;
z-index:1001;
}

/* 사이드 메뉴 */

.side-menu{
position:fixed;
top:0;
left:-300px;
width:300px;
height:100%;
background:#1f2937;
overflow-y:auto;
transition:.3s;
z-index:1002;
}

.side-menu.active{
left:0;
}

.profile{
padding:30px;
text-align:center;
border-bottom:1px solid #374151;
}

.profile img{
width:90px;
height:90px;
border-radius:50%;
border:3px solid #2563eb;
}

.profile h3{
color:#fff;
margin-top:10px;
}

.profile p{
color:#9ca3af;
font-size:13px;
}

.side-menu a{
display:block;
padding:18px 25px;
text-decoration:none;
color:white;
border-bottom:1px solid #374151;
}

.side-menu a:hover{
background:#2563eb;
}

.side-menu i{
width:25px;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
visibility:hidden;
opacity:0;
transition:.3s;
z-index:1000;
}

.overlay.active{
visibility:visible;
opacity:1;
}

/* 헤더 */

header{
background:linear-gradient(135deg,#2563eb,#1e40af);
color:white;
padding:70px 20px 30px;
text-align:center;
}

#clock{
margin-top:10px;
font-size:15px;
}

/* 카드 */

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.dark .card{
background:#1f2937;
}

/* iframe */

iframe{
width:100%;
height:700px;
border:none;
border-radius:10px;
}

/* 카카오 배너 */

.kakao{
text-align:center;
}

.kakao img{
width:100%;
max-width:700px;
border-radius:15px;
transition:.3s;
}

.kakao img:hover{
transform:scale(1.02);
}

/* 공지 */

.notice li{
padding:10px;
border-bottom:1px solid #ddd;
}

/* 다크모드 버튼 */

.dark-btn{
position:fixed;
bottom:20px;
right:20px;
width:55px;
height:55px;
border:none;
border-radius:50%;
background:#111827;
color:white;
font-size:20px;
cursor:pointer;
z-index:999;
}

/* 모바일 */

@media(max-width:768px){

iframe{
height:600px;
}

header{
padding-top:90px;
}

}

</style>
</head>

<body>

<button class="menu-btn" onclick="toggleMenu()">
<i class="fas fa-bars"></i>
</button>

<div class="side-menu" id="sideMenu">

<div class="profile">

<img src="https://via.placeholder.com/100" alt="프로필">

<h3>실시간 정보센터</h3>

<p>환영합니다</p>

</div>

<a href="#home"><i class="fas fa-house"></i> 홈</a>

<a href="#data"><i class="fas fa-chart-line"></i> 실시간 정보</a>

<a href="#chat"><i class="fas fa-comments"></i> 오픈채팅</a>

<a href="#notice"><i class="fas fa-bullhorn"></i> 공지사항</a>

<a href="#contact"><i class="fas fa-envelope"></i> 문의하기</a>

</div>

<div id="overlay" class="overlay"
onclick="toggleMenu()"></div>

<header id="home">

<h1>실시간 정보센터</h1>

<div id="clock"></div>

</header>

<div class="container">

<section id="data" class="card">

<h2>📊 실시간 데이터</h2>

<br>

<iframe
src="https://docs.google.com/spreadsheets/d/e/2PACX-1vStUOzyVL0J8xiRDwcg06VVJzW3kiTcuuwmbiul6XW6zMFdjI4oQJBr45PnTzJrkxygqoeGwx85gijH/pubhtml?gid=2132959836&range=A1:D14&widget=false">
</iframe>

</section>

<section id="chat" class="card">

<h2>💬 카카오 오픈채팅</h2>

<br>

<div class="kakao">

<a href="https://open.kakao.com/o/gNFprHE"
target="_blank">

<img
src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhb_SWgINkBSlHd4NRxrHu37DzmeEcERXjp2KvSAeuQPhGVD3Lpty38HtXELDj83JcVbPMmFFeDCHgvprswgO5R2rWicae7S4DoJsArfkKVxbuRlVaCgiLnMPmekB9LWACndu20HpsVyfYP/s640/%25EC%25B9%25B4%25EC%25B9%25A4%25EC%2598%25A4%25ED%2586%25A1+%25EC%2598%25A4%25ED%2594%2588%25EC%25B1%2584%25ED%258C%2585+%25EB%25B0%25B0%25EB%2584%2588.png">

</a>

</div>

</section>

<section id="notice" class="card">

<h2>📢 공지사항</h2>

<br>

<ul class="notice">

<li>홈페이지가 새롭게 개편되었습니다.</li>

<li>실시간 데이터가 자동 갱신됩니다.</li>

<li>오픈채팅 참여를 환영합니다.</li>

</ul>

</section>

<section id="contact" class="card">

<h2>📧 문의하기</h2>

<br>

<p>문의는 카카오 오픈채팅을 이용해 주세요.</p>

</section>

</div>

<button class="dark-btn"
onclick="toggleDarkMode()">
🌙
</button>

<script>

function toggleMenu(){

document.getElementById('sideMenu')
.classList.toggle('active');

document.getElementById('overlay')
.classList.toggle('active');

}

function toggleDarkMode(){

document.body.classList.toggle('dark');

}

function updateClock(){

const now=new Date();

document.getElementById("clock")
.innerHTML=now.toLocaleString("ko-KR");

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>
</html>
