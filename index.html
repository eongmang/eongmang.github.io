<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- 메뉴 버튼 -->
<button class="menu-btn" onclick="toggleMenu()">
    <i class="fas fa-bars"></i>
</button>

<!-- 숨김 메뉴 -->
<div id="sideMenu" class="side-menu">

    <div class="menu-header">
        <h3>메뉴</h3>
        <button class="close-btn" onclick="toggleMenu()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <a href="#home">
        <i class="fas fa-house"></i> 홈
    </a>

    <a href="#data">
        <i class="fas fa-chart-line"></i> 실시간 정보
    </a>

    <a href="#chat">
        <i class="fas fa-comments"></i> 오픈채팅
    </a>

    <a href="#notice">
        <i class="fas fa-bullhorn"></i> 공지사항
    </a>

    <a href="#contact">
        <i class="fas fa-envelope"></i> 문의하기
    </a>

</div>

<!-- 배경 -->
<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<style>
.menu-btn{
    position:fixed;
    top:15px;
    left:15px;
    width:50px;
    height:50px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:22px;
    cursor:pointer;
    z-index:1001;
}

/* 사이드 메뉴 */
.side-menu{
    position:fixed;
    top:0;
    left:-280px;
    width:280px;
    height:100%;
    background:#1f2937;
    transition:.3s;
    z-index:1002;
    overflow-y:auto;
}

.side-menu.active{
    left:0;
}

.menu-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
    color:white;
    border-bottom:1px solid #374151;
}

.close-btn{
    background:none;
    border:none;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.side-menu a{
    display:block;
    padding:18px 20px;
    color:white;
    text-decoration:none;
    border-bottom:1px solid #374151;
}

.side-menu a:hover{
    background:#2563eb;
}

.side-menu i{
    width:25px;
}

/* 배경 어둡게 */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:1000;
}

.overlay.active{
    opacity:1;
    visibility:visible;
}
</style>

<script>
function toggleMenu(){

    document
      .getElementById("sideMenu")
      .classList.toggle("active");

    document
      .getElementById("overlay")
      .classList.toggle("active");
}
</script>
