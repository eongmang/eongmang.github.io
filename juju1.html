<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실시간 정보센터</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Noto Sans KR', sans-serif;
    background:#f4f6f9;
    color:#333;
}

header{
    background:#2c3e50;
    color:white;
    padding:20px;
    text-align:center;
}

#clock{
    margin-top:10px;
    font-size:1rem;
    color:#ddd;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

iframe{
    width:100%;
    height:700px;
    border:none;
}

.kakao-banner{
    text-align:center;
}

.kakao-banner img{
    width:100%;
    max-width:700px;
    border-radius:10px;
    transition:.3s;
}

.kakao-banner img:hover{
    transform:scale(1.02);
}

footer{
    text-align:center;
    padding:20px;
    color:#666;
}

@media(max-width:768px){
    iframe{
        height:600px;
    }
}
</style>
</head>
<body>

<header>
    <h1>실시간 정보센터</h1>
    <div id="clock"></div>
</header>

<div class="container">

    <div class="card">
        <h2>실시간 데이터</h2>
        <br>

        <iframe
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vStUOzyVL0J8xiRDwcg06VVJzW3kiTcuuwmbiul6XW6zMFdjI4oQJBr45PnTzJrkxygqoeGwx85gijH/pubhtml?gid=2132959836&range=A1:D14&widget=false"
        loading="lazy"
        allowfullscreen>
        </iframe>

    </div>

    <div class="card">
        <h2>오픈채팅 참여</h2>
        <br>

        <div class="kakao-banner">
            <a href="https://open.kakao.com/o/gNFprHE" target="_blank">
                <img
                src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhb_SWgINkBSlHd4NRxrHu37DzmeEcERXjp2KvSAeuQPhGVD3Lpty38HtXELDj83JcVbPMmFFeDCHgvprswgO5R2rWicae7S4DoJsArfkKVxbuRlVaCgiLnMPmekB9LWACndu20HpsVyfYP/s640/%25EC%25B9%25B4%25EC%25B9%25A4%25EC%2598%25A4%25ED%2586%25A1+%25EC%2598%25A4%25ED%2594%2588%25EC%25B1%2584%25ED%258C%2585+%25EB%25B0%25B0%25EB%2584%2588.png"
                alt="카카오톡 오픈채팅">
            </a>
        </div>

    </div>

</div>

<footer>
    © 2026 실시간 정보센터
</footer>

<script>
function updateClock() {
    const now = new Date();

    const time = now.toLocaleString('ko-KR', {
        year:'numeric',
        month:'long',
        day:'numeric',
        weekday:'long',
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit'
    });

    document.getElementById('clock').innerHTML =
        "현재시간 : " + time;
}

updateClock();
setInterval(updateClock,1000);
</script>

</body>
</html>
